[package]
name = "korean-name-maker"
version = "0.1.0"
description = "무료 윈도우 작명 도우미"
authors = ["sinmb79"]
license = "MIT"
repository = "https://github.com/sinmb79/korean-name-maker"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "korean_name_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
